<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FileDrop</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #18181f;
    --border: #2a2a38;
    --accent: #7c6bff;
    --accent2: #ff6b9d;
    --accent3: #6bffe4;
    --text: #e8e8f0;
    --text-dim: #7a7a90;
    --text-dimmer: #3a3a50;
    --folder: #ffb347;
    --video: #ff6b9d;
    --audio: #6bffe4;
    --image: #a8ff78;
    --pdf: #ff4d4d;
    --doc: #6b9fff;
    --sheet: #78ffb0;
    --archive: #ffda6b;
    --code: #c8ff6b;
    --apk: #ff9f6b;
    --other: #9a9ab0;
    --radius: 12px;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background grid effect */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.25;
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    top: -50%;
    left: -20%;
    width: 60%;
    height: 80%;
    background: radial-gradient(ellipse, rgba(124,107,255,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* Header */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-icon {
    width: 38px;
    height: 38px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    box-shadow: 0 0 20px rgba(124,107,255,0.35);
  }

  .logo-text {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .logo-text span { color: var(--accent); }

  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .qr-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    border-radius: 8px;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    transition: all 0.2s;
  }

  .qr-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(124,107,255,0.08);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    background: var(--accent3);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent3);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Main layout */
  .container {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px;
  }

  /* Breadcrumb */
  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 24px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    flex-wrap: wrap;
  }

  .breadcrumb-item {
    cursor: pointer;
    color: var(--text-dim);
    transition: color 0.2s;
    padding: 3px 8px;
    border-radius: 6px;
  }

  .breadcrumb-item:hover { color: var(--accent); background: rgba(124,107,255,0.1); }
  .breadcrumb-item.active { color: var(--text); cursor: default; }
  .breadcrumb-item.active:hover { background: transparent; }

  .breadcrumb-sep { color: var(--text-dimmer); }

  /* Toolbar */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .search-box {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    flex: 1;
    max-width: 360px;
    transition: border-color 0.2s;
  }

  .search-box:focus-within { border-color: var(--accent); }

  .search-box input {
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    width: 100%;
  }

  .search-box input::placeholder { color: var(--text-dimmer); }

  .filter-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .filter-tab {
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    cursor: pointer;
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
  }

  .filter-tab:hover { border-color: var(--accent); color: var(--accent); }
  .filter-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 24px;
    margin-bottom: 24px;
    padding: 16px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    flex-wrap: wrap;
  }

  .stats-bar span { display: flex; align-items: center; gap: 6px; }
  .stats-bar strong { color: var(--text); }

  /* File grid */
  .file-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }

  .file-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    cursor: pointer;
    transition: all 0.22s cubic-bezier(0.4,0,0.2,1);
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.3s ease both;
  }

  .file-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 60%, rgba(124,107,255,0.04));
    pointer-events: none;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .file-card:hover {
    border-color: var(--accent);
    background: var(--surface2);
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.3), 0 0 0 1px rgba(124,107,255,0.1);
  }

  .file-card:active { transform: translateY(0); }

  .file-icon {
    font-size: 36px;
    margin-bottom: 12px;
    display: block;
    line-height: 1;
  }

  .file-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-bottom: 6px;
  }

  .file-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .file-size {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
  }

  .file-type-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 7px;
    border-radius: 5px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .badge-folder { background: rgba(255,179,71,0.12); color: var(--folder); }
  .badge-video { background: rgba(255,107,157,0.12); color: var(--video); }
  .badge-audio { background: rgba(107,255,228,0.12); color: var(--audio); }
  .badge-image { background: rgba(168,255,120,0.12); color: var(--image); }
  .badge-pdf { background: rgba(255,77,77,0.12); color: var(--pdf); }
  .badge-doc { background: rgba(107,159,255,0.12); color: var(--doc); }
  .badge-sheet { background: rgba(120,255,176,0.12); color: var(--sheet); }
  .badge-archive { background: rgba(255,218,107,0.12); color: var(--archive); }
  .badge-code { background: rgba(200,255,107,0.12); color: var(--code); }
  .badge-apk { background: rgba(255,159,107,0.12); color: var(--apk); }
  .badge-other { background: rgba(154,154,176,0.12); color: var(--other); }

  .download-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 32px;
    height: 32px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: all 0.2s;
    font-size: 15px;
    color: #fff;
    box-shadow: 0 4px 12px rgba(124,107,255,0.4);
  }

  .file-card:hover .download-btn { opacity: 1; }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-dim);
  }

  .empty-state .icon { font-size: 64px; margin-bottom: 16px; opacity: 0.5; }
  .empty-state h3 { font-size: 20px; margin-bottom: 8px; color: var(--text); }
  .empty-state p { font-family: 'DM Mono', monospace; font-size: 14px; }

  /* Loading */
  .loading {
    display: flex;
    justify-content: center;
    padding: 60px;
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* QR Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px;
    text-align: center;
    max-width: 340px;
    width: 90%;
    transform: scale(0.9);
    transition: transform 0.3s;
  }

  .modal-overlay.open .modal { transform: scale(1); }

  .modal h2 {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 8px;
  }

  .modal p {
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    margin-bottom: 24px;
  }

  .qr-frame {
    background: #fff;
    border-radius: 12px;
    padding: 12px;
    display: inline-block;
    margin-bottom: 20px;
  }

  .qr-frame img { width: 180px; height: 180px; display: block; }

  .qr-url {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    color: var(--accent3);
    background: rgba(107,255,228,0.08);
    padding: 8px 16px;
    border-radius: 8px;
    word-break: break-all;
    margin-bottom: 24px;
  }

  .modal-close {
    padding: 10px 24px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .modal-close:hover { opacity: 0.85; }

  /* Preview modal */
  .preview-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(12px);
    z-index: 300;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    padding: 20px;
  }

  .preview-overlay.open { opacity: 1; pointer-events: all; }

  .preview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 900px;
    margin-bottom: 16px;
    gap: 16px;
  }

  .preview-title {
    font-size: 16px;
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .preview-actions {
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }

  .preview-actions a,
  .preview-actions button {
    padding: 8px 18px;
    border-radius: 8px;
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
  }

  .btn-download {
    background: var(--accent);
    color: #fff;
    border: none;
  }

  .btn-close {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
  }

  .btn-close:hover { border-color: var(--text-dim); color: var(--text); }

  .preview-content {
    width: 100%;
    max-width: 900px;
    max-height: 75vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .preview-content video,
  .preview-content audio {
    width: 100%;
    border-radius: 12px;
    background: #000;
  }

  .preview-content img {
    max-width: 100%;
    max-height: 70vh;
    border-radius: 12px;
    object-fit: contain;
  }

  .preview-content iframe {
    width: 100%;
    height: 70vh;
    border-radius: 12px;
    border: none;
    background: #fff;
  }

  .no-preview {
    text-align: center;
    padding: 60px;
    color: var(--text-dim);
  }

  .no-preview .big-icon { font-size: 72px; margin-bottom: 16px; }
  .no-preview h3 { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: var(--text); }

  /* Responsive */
  @media (max-width: 600px) {
    header { padding: 0 16px; }
    .container { padding: 20px 14px; }
    .file-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    .logo-text { font-size: 18px; }
    .filter-tabs { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">📂</div>
    <div class="logo-text">File<span>Drop</span></div>
  </div>
  <div class="header-right">
    <div class="status-dot"></div>
    <button class="qr-btn" onclick="openQR()">
      <span>📱</span> QR Connect
    </button>
  </div>
</header>

<div class="container">
  <div class="breadcrumb" id="breadcrumb">
    <span class="breadcrumb-item active" onclick="navigate('')">🏠 Home</span>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <span style="color:var(--text-dim)">🔍</span>
      <input type="text" id="search" placeholder="Search files..." oninput="filterFiles()" />
    </div>
    <div class="filter-tabs">
      <button class="filter-tab active" onclick="setFilter('all', this)">All</button>
      <button class="filter-tab" onclick="setFilter('folder', this)">📁 Folders</button>
      <button class="filter-tab" onclick="setFilter('video', this)">🎬 Videos</button>
      <button class="filter-tab" onclick="setFilter('audio', this)">🎵 Audio</button>
      <button class="filter-tab" onclick="setFilter('image', this)">🖼️ Images</button>
      <button class="filter-tab" onclick="setFilter('pdf', this)">📄 PDFs</button>
      <button class="filter-tab" onclick="setFilter('apk', this)">📦 APKs</button>
    </div>
  </div>

  <div class="stats-bar" id="stats-bar">
    <span>Loading...</span>
  </div>

  <div id="content">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>

<!-- QR Modal -->
<div class="modal-overlay" id="qr-modal" onclick="e => { if(e.target === this) closeQR() }">
  <div class="modal">
    <h2>📱 Connect Phone</h2>
    <p>Make sure your phone is on the<br/>same WiFi network</p>
    <div class="qr-frame">
      <img id="qr-img" src="" alt="QR Code" />
    </div>
    <div class="qr-url" id="qr-url">Loading...</div>
    <button class="modal-close" onclick="closeQR()">Got it!</button>
  </div>
</div>

<!-- Preview Modal -->
<div class="preview-overlay" id="preview-modal">
  <div class="preview-header">
    <div class="preview-title" id="preview-title"></div>
    <div class="preview-actions">
      <a id="preview-download" href="#" class="btn-download" download>⬇ Download</a>
      <button class="btn-close" onclick="closePreview()">✕ Close</button>
    </div>
  </div>
  <div class="preview-content" id="preview-content"></div>
</div>

<script>
  let allFiles = [];
  let currentPath = '';
  let currentFilter = 'all';
  let pathHistory = [{ label: '🏠 Home', path: '' }];

  const ICONS = {
    folder: '📁', video: '🎬', audio: '🎵', image: '🖼️',
    pdf: '📄', doc: '📝', sheet: '📊', archive: '🗜️',
    code: '💻', apk: '📦', other: '📎'
  };

  async function loadFiles(path = '') {
    currentPath = path;
    document.getElementById('content').innerHTML = '<div class="loading"><div class="spinner"></div></div>';

    try {
      const res = await fetch(`/api/files?path=${encodeURIComponent(path)}`);
      const data = await res.json();
      allFiles = data.files;
      updateBreadcrumb();
      renderFiles();
    } catch (err) {
      document.getElementById('content').innerHTML =
        `<div class="empty-state"><div class="icon">⚠️</div><h3>Error loading files</h3><p>${err.message}</p></div>`;
    }
  }

  function renderFiles() {
    const query = document.getElementById('search').value.toLowerCase();
    let files = allFiles.filter(f => {
      const matchSearch = f.name.toLowerCase().includes(query);
      const matchFilter = currentFilter === 'all' || f.type === currentFilter;
      return matchSearch && matchFilter;
    });

    // Stats
    const total = allFiles.length;
    const folders = allFiles.filter(f => f.isDirectory).length;
    const totalSize = allFiles.filter(f => !f.isDirectory).reduce((s, f) => s + f.size, 0);
    document.getElementById('stats-bar').innerHTML =
      `<span>📁 <strong>${folders}</strong> folders</span>
       <span>📄 <strong>${total - folders}</strong> files</span>
       <span>💾 <strong>${formatSize(totalSize)}</strong> total</span>
       <span style="color:var(--text-dimmer)">Showing <strong style="color:var(--text)">${files.length}</strong></span>`;

    if (files.length === 0) {
      document.getElementById('content').innerHTML =
        `<div class="empty-state"><div class="icon">🔍</div><h3>Nothing found</h3><p>Try a different search or filter</p></div>`;
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'file-grid';

    files.forEach((file, i) => {
      const card = document.createElement('div');
      card.className = 'file-card';
      card.style.animationDelay = `${Math.min(i * 30, 300)}ms`;

      const icon = ICONS[file.type] || '📎';
      const badgeClass = `badge-${file.type}`;

      card.innerHTML = `
        <span class="file-icon">${icon}</span>
        <div class="file-name" title="${file.name}">${file.name}</div>
        <div class="file-meta">
          <span class="file-size">${file.sizeFormatted}</span>
          <span class="file-type-badge ${badgeClass}">${file.type}</span>
        </div>
        ${!file.isDirectory ? `<div class="download-btn" title="Download">⬇</div>` : ''}
      `;

      card.onclick = (e) => {
        const btn = e.target.closest('.download-btn');
        if (btn) {
          e.stopPropagation();
          downloadFile(file);
        } else if (file.isDirectory) {
          navigate(file.path);
        } else {
          openPreview(file);
        }
      };

      grid.appendChild(card);
    });

    document.getElementById('content').innerHTML = '';
    document.getElementById('content').appendChild(grid);
  }

  function navigate(path) {
    if (path === currentPath) return;

    // Build history
    if (path === '') {
      pathHistory = [{ label: '🏠 Home', path: '' }];
    } else {
      // Check if going back
      const idx = pathHistory.findIndex(p => p.path === path);
      if (idx >= 0) {
        pathHistory = pathHistory.slice(0, idx + 1);
      } else {
        const name = path.split('/').pop();
        pathHistory.push({ label: name, path });
      }
    }

    loadFiles(path);
  }

  function updateBreadcrumb() {
    const bc = document.getElementById('breadcrumb');
    bc.innerHTML = pathHistory.map((item, i) => {
      const isLast = i === pathHistory.length - 1;
      return `
        ${i > 0 ? '<span class="breadcrumb-sep">/</span>' : ''}
        <span class="breadcrumb-item ${isLast ? 'active' : ''}" 
              onclick="${isLast ? '' : `navigate('${item.path}')`}">
          ${item.label}
        </span>
      `;
    }).join('');
  }

  function setFilter(type, btn) {
    currentFilter = type;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderFiles();
  }

  function filterFiles() { renderFiles(); }

  function downloadFile(file) {
    const a = document.createElement('a');
    a.href = `/api/download?path=${encodeURIComponent(file.path)}`;
    a.download = file.name;
    a.click();
  }

  function openPreview(file) {
    const modal = document.getElementById('preview-modal');
    const content = document.getElementById('preview-content');
    document.getElementById('preview-title').textContent = file.name;
    document.getElementById('preview-download').href = `/api/download?path=${encodeURIComponent(file.path)}`;
    document.getElementById('preview-download').download = file.name;

    const streamUrl = `/api/stream?path=${encodeURIComponent(file.path)}`;
    content.innerHTML = '';

    if (file.type === 'video') {
      content.innerHTML = `<video controls autoplay><source src="${streamUrl}"><p>Video not supported</p></video>`;
    } else if (file.type === 'audio') {
      content.innerHTML = `<audio controls autoplay style="width:100%"><source src="${streamUrl}"><p>Audio not supported</p></audio>`;
    } else if (file.type === 'image') {
      content.innerHTML = `<img src="${streamUrl}" alt="${file.name}" />`;
    } else if (file.type === 'pdf') {
      content.innerHTML = `<iframe src="${streamUrl}" title="${file.name}"></iframe>`;
    } else {
      content.innerHTML = `
        <div class="no-preview">
          <div class="big-icon">${ICONS[file.type] || '📎'}</div>
          <h3>${file.name}</h3>
          <p style="color:var(--text-dim);margin-bottom:24px;font-family:'DM Mono',monospace;font-size:14px">${file.sizeFormatted} · ${file.type.toUpperCase()}</p>
          <a href="/api/download?path=${encodeURIComponent(file.path)}" download="${file.name}" class="btn-download" style="padding:12px 28px;border-radius:10px;font-size:15px">⬇ Download File</a>
        </div>
      `;
    }

    modal.classList.add('open');
  }

  function closePreview() {
    document.getElementById('preview-modal').classList.remove('open');
    // Stop media
    document.querySelectorAll('#preview-content video, #preview-content audio').forEach(m => {
      m.pause();
    });
    document.getElementById('preview-content').innerHTML = '';
  }

  // Close preview on background click
  document.getElementById('preview-modal').addEventListener('click', function(e) {
    if (e.target === this) closePreview();
  });

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      closePreview();
      closeQR();
    }
  });

  async function openQR() {
    document.getElementById('qr-modal').classList.add('open');
    try {
      const res = await fetch('/api/qr');
      const data = await res.json();
      document.getElementById('qr-img').src = data.qr;
      document.getElementById('qr-url').textContent = data.url;
    } catch (err) {
      document.getElementById('qr-url').textContent = 'Error loading QR';
    }
  }

  function closeQR() {
    document.getElementById('qr-modal').classList.remove('open');
  }

  document.getElementById('qr-modal').addEventListener('click', function(e) {
    if (e.target === this) closeQR();
  });

  function formatSize(bytes) {
    if (bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
  }

  // Initial load
  loadFiles('');
</script>
</body>
</html>
